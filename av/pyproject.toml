[project]
name = "tensorcodec-av"
# Version comes from Cargo.toml and must equal tensorcodec's (tests/test_versions.py).
dynamic = ["version"]
description = "FFmpeg-based audio/video decoders for tensorcodec"
readme = "README.md"
license = "Apache-2.0 AND LGPL-3.0-or-later AND BSD-2-Clause"
license-files = ["LICENSE", "licenses/*"]
authors = [{ name = "Suhwan Choi", email = "milkclouds00@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Repository = "https://github.com/MilkClouds/tensorcodec"
Issues = "https://github.com/MilkClouds/tensorcodec/issues"

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "tensorcodec_av._av"
features = ["pyo3/extension-module"]
