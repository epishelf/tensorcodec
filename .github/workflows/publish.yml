name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload validated distributions to PyPI
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  python:
    uses: ./.github/workflows/build-python.yml
  av:
    needs: python
    uses: ./.github/workflows/build-av.yml
  publish:
    needs: [python, av]
    if: inputs.publish
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/tensorcodec/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-av-*
          merge-multiple: true
          path: av-dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-python
          path: python-dist
      # tensorcodec-av first: tensorcodec pins tensorcodec-av exactly, so it must not appear before its pin exists.
      - name: Publish tensorcodec-av
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: av-dist/
      - name: Publish tensorcodec
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/
  update-size-docs:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
      - name: Measure published wheels and refresh documentation
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          uv run --no-project python scripts/update_size_comparison.py --version "$version"
      - name: Commit published size snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md packaging/size-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: update published wheel size comparison'
            git push origin HEAD:main
          fi
