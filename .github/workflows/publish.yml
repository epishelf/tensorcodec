name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload validated distributions to PyPI
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  python:
    uses: ./.github/workflows/build-python.yml
  av:
    needs: python
    uses: ./.github/workflows/build-av.yml
  check:
    needs: [python, av]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: artifacts
      - name: Check the release set
        run: |
          python3 - <<'EOF'
          import pathlib, re
          files = sorted(p for p in pathlib.Path("artifacts").rglob("*") if p.is_file())
          names = [f.name for f in files]
          print("\n".join(names))
          versions = {re.match(r"tensorcodec(?:_av)?-([^-]+?)(?:\.tar\.gz|-)", n)[1] for n in names}
          assert len(versions) == 1, f"mixed versions: {versions}"
          expected = ["tensorcodec-*-py3-none-any.whl", "tensorcodec-*.tar.gz", "tensorcodec_av-*.tar.gz",
                      "tensorcodec_av-*manylinux*x86_64.whl", "tensorcodec_av-*manylinux*aarch64.whl",
                      "tensorcodec_av-*macosx*arm64.whl"]
          for pattern in expected:
              assert len([f for f in files if f.match(pattern)]) == 1, pattern
          assert len(files) == len(expected), names
          EOF
  publish:
    needs: check
    if: inputs.publish
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/tensorcodec/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-av-*
          merge-multiple: true
          path: av-dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-python
          path: python-dist
      # tensorcodec-av first: tensorcodec pins tensorcodec-av exactly, so it must not appear before its pin exists.
      - name: Publish tensorcodec-av
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: av-dist/
      - name: Publish tensorcodec
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/
  update-size-docs:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
      - name: Measure published wheels and refresh documentation
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          uv run --no-project python scripts/update_size_comparison.py --version "$version"
      - name: Commit published size snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md packaging/size-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: update published wheel size comparison'
            git push origin HEAD:main
          fi
