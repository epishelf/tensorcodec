name: Pure-Python wheel
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and check wheel
        run: |
          python -m pip install twine
          python scripts/build_pure_wheel.py --out dist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions-pure
          path: dist/*.whl
          if-no-files-found: error
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            python: '3.12'
          - runner: macos-15-intel
            python: '3.12'
          - runner: ubuntu-24.04
            python: '3.10'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: pypi-distributions-pure
          path: dist
      # Fixtures need libaom; Homebrew's FFmpeg lacks it, so use conda-forge's like the other jobs.
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          global-environments: ffmpeg=7.1.1=gpl_*
          global-cache: true
      - name: Check fixture FFmpeg
        run: ffmpeg -hide_banner -encoders | grep libaom-av1
      - name: Install wheel without a Rust toolchain
        run: |
          python -m pip install pytest 'Pillow>=11.3' 'opencv-python-headless>=4.13,<5'
          python -m pip install --no-index --find-links dist tensorcodec
          python -c "import importlib.util as u; assert u.find_spec('tensorcodec._native') is None"
      - name: Test image codecs
        run: python -m pytest tests/test_images.py tests/test_image_encoders.py tests/test_native_optional.py
