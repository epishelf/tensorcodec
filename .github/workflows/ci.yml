name: CI
on:
  push:
    branches: [main, tensorcodec]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    uses: ./.github/workflows/build-python.yml
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            native:
              - 'native/**'
              - 'scripts/**'
              - 'tests/**'
              - '.github/workflows/**'
              - 'pyproject.toml'
  # Release builds of every tensorcodec-native wheel: on pushes (including main) and on PRs that touch
  # what they build or validate. Other PRs rely on the `test` job's development build.
  native:
    needs: [python, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build-native.yml
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          global-environments: ffmpeg=7.1.1=gpl_* --with libclang=18 --with pkg-config
          global-cache: true
      - name: Install build tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install numpy pytest ruff 'maturin>=1.8,<2' 'opencv-python-headless>=4.12' 'Pillow>=11.3'
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - name: Configure prebuilt FFmpeg
        run: |
          prefix="$HOME/.pixi/envs/ffmpeg"
          test -f "$prefix/include/libavcodec/avcodec.h"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"
          "$prefix/bin/ffmpeg" -version
      - name: Static checks
        run: |
          ruff check src/tensorcodec native/python tests scripts benchmarks/image_codecs.py
          ruff format --check src/tensorcodec native/python tests scripts benchmarks/image_codecs.py
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo clippy --manifest-path native/Cargo.toml --locked -- -D warnings
      - name: Build tensorcodec-native against prebuilt FFmpeg and install tensorcodec
        run: |
          maturin develop -m native/Cargo.toml --locked
          pip install -e .
      - name: Install pinned reference
        run: python -m pip install torch==2.14.1 torchcodec==0.17.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate independent contract against reference
        run: pytest tests/test_video_contract.py tests/test_audio_contract.py --backend torchcodec
      - name: Run contract and differential tests
        run: pytest --compare
