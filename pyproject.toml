[project]
name = "tensorcodec"
version = "0.4.2"
description = "Video, audio and image codecs with TorchCodec-style APIs and NumPy arrays"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Suhwan Choi", email = "milkclouds00@gmail.com" }]
requires-python = ">=3.10"
# Exact pin; the marker follows the tensorcodec-av wheel tags. No platform_release check (macOS 14):
# pip's packaging 22-25 raises on Linux kernel releases that are not PEP 440 versions.
# GIF and AVIF need opencv-python-headless 4.12+, which requires NumPy 2.
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.11",
    "tensorcodec-av==0.4.2; platform_python_implementation == 'CPython' and ((sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Repository = "https://github.com/MilkClouds/tensorcodec"
Issues = "https://github.com/MilkClouds/tensorcodec/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "maturin>=1.8,<2", "Pillow>=11.3"]
oracle = ["torch==2.14.1", "torchcodec==0.17.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorcodec"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "av", "tests", "docs", "scripts", "benchmarks", "packaging", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.uv.sources]
tensorcodec-av = { path = "av", editable = true }
torch = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
